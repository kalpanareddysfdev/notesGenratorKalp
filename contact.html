<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Kalpana's Learning Hub.">
  <title>Contact | Kalpana's Learning Hub</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f19;
      --surface: #111827;
      --border: #1f293d;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --primary: #60a5fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100%, 600px);
      padding: 36px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
    }

    h1 { margin: 0 0 12px; }
    p { color: var(--muted); }
    a { color: var(--primary); }
    .back { display: inline-block; margin-top: 20px; }

    @media (max-width: 480px) {
      main { padding: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Contact</h1>
    <p>For questions or feedback about Kalpana's Learning Hub, email:</p>
    <p><a href="mailto:kalpanavreddy1996@gmail.com">kalpanavreddy1996@gmail.com</a></p>
    <a class="back" href="index.html">← Back to the Learning Hub</a>
  </main>
</body>
</html>
